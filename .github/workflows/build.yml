name: Tests and Windows build

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: Simulation tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test DotNetTests --logger "console;verbosity=normal"

  licence-check:
    name: Check Unity licence secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets are not all set, so Unity tests and the Windows build are skipped. See Documentation/BuildAndTest.md."
          fi

  unity-tests:
    name: Unity Edit Mode and Play Mode tests
    needs: licence-check
    if: needs.licence-check.outputs.available == 'true'
    runs-on: ubuntu-latest
    # The test runner publishes results as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      # The Unity editor image needs more disk than a standard runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: test-results

  # The v2 branch ships both versions in one download: v1 is built from main exactly as main builds
  # itself, v2 from this commit. Each is its own Unity project build with its own product name, so
  # their saves and settings live in separate folders on the player's PC.
  windows-build:
    name: Windows build (${{ matrix.title }})
    needs: licence-check
    if: needs.licence-check.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Tiny City
            ref: main
            buildName: TinyCity
            cache: Library-windows-v1
          - title: Tiny City 2
            ref: ''
            buildName: TinyCity2
            cache: Library-windows-v2
    steps:
      # The Unity editor image needs more disk than a standard runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/cache@v4
        with:
          path: Library
          key: ${{ matrix.cache }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: ${{ matrix.cache }}-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ${{ matrix.buildName }}
          buildMethod: TinyCity.Editor.BuildScript.BuildWindows
          versioning: Custom
          version: 0.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.buildName }}
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package both versions
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: part-TinyCity
          path: package/Tiny City
      - uses: actions/download-artifact@v4
        with:
          name: part-TinyCity2
          path: package/Tiny City 2
      - name: Check both games are there
        run: |
          test -f "package/Tiny City/TinyCity.exe"
          test -f "package/Tiny City 2/TinyCity2.exe"
          ls -la package
      - uses: actions/upload-artifact@v4
        with:
          name: TinyCity-Windows-0.0.${{ github.run_number }}
          path: package
          if-no-files-found: error
